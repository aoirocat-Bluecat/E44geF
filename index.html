<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友達追加 トースト通知</title>
  <style>
    /* 全体・背景（確認用のダーク背景） */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #1a1d24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* デモ用：トースト再表示ボタン */
    .demo-btn {
      padding: 12px 24px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .demo-btn:hover {
      background-color: #1d4ed8;
    }

    /* トースト配置（画面右上） */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      width: calc(100% - 48px);
      max-width: 400px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* トースト本体 */
    .toast-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toast-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    .icon-user {
      width: 24px;
      height: 24px;
      fill: #2563eb;
    }

    .close-button {
      background: none;
      border: none;
      font-size: 20px;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: 6px;
      transition: color 0.2s, background-color 0.2s;
    }

    .close-button:hover {
      color: #4b5563;
      background-color: #f3f4f6;
    }

    .toast-description {
      margin: 14px 0 0 0;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }

    .toast-form {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      color: #1f2937;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .toast-input::placeholder {
      color: #9ca3af;
    }

    .toast-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .submit-button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .submit-button:hover {
      background-color: #1d4ed8;
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    /* アニメーション */
    @keyframes slideIn {
      from {
        transform: translateX(120%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast-hide {
      animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(120%);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- デモ用トースト表示ボタン -->
  <button class="demo-btn" onclick="showToast()">トーストを表示</button>

  <!-- トースト通知 -->
  <div class="toast-container" id="toast">
    <div class="toast-card">
      <div class="toast-header">
        <div class="toast-title">
          <svg class="icon-user" viewBox="0 0 24 24">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>友達を追加</span>
        </div>
        <button class="close-button" id="closeToast" aria-label="閉じる">&times;</button>
      </div>
      
      <p class="toast-description">
        追加したい相手の「ユーザーID（例: my_id）」を入力してください。
      </p>
      
      <form class="toast-form" id="toastForm">
        <input type="text" placeholder="@ my_id" class="toast-input" required />
        <button type="submit" class="submit-button">リクエストを送信</button>
      </form>
    </div>
  </div>

  <script>
    const toast = document.getElementById('toast');
    const closeBtn = document.getElementById('closeToast');
    const toastForm = document.getElementById('toastForm');

    // 非表示処理
    function hideToast() {
      toast.classList.add('toast-hide');
      setTimeout(() => {
        toast.style.display = 'none';
      }, 300);
    }

    // 表示処理
    function showToast() {
      toast.style.display = 'block';
      toast.classList.remove('toast-hide');
    }

    // 閉じるボタン
    closeBtn.addEventListener('click', hideToast);

    // フォーム送信
    toastForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = toastForm.querySelector('input');
      if (input.value.trim()) {
        alert(`ユーザーID: ${input.value} にリクエストを送信しました`);
        input.value = '';
        hideToast();
      }
    });
  </script>
</body>
</html>
