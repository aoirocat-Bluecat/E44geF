<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E44geF - Chat & Video Call</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    /* Custom styles for neat scrollbars and WebRTC video layouts */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Utility class to hide scrollbar but allow scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-screen overflow-hidden flex font-sans antialiased selection:bg-blue-200 selection:text-blue-900">

  <!-- Initial Loading Screen -->
  <div id="loading-overlay" class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="text-blue-600 text-6xl font-black mb-6 drop-shadow-sm tracking-tighter">E44geF</div>
    <div class="relative w-16 h-16">
      <div class="absolute inset-0 border-4 border-blue-100 rounded-full"></div>
      <div class="absolute inset-0 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <p class="mt-6 text-gray-500 font-medium tracking-widest text-sm uppercase">Connecting...</p>
  </div>

  <!-- Main Application Layout -->
  <div class="flex w-full h-full">
    
    <!-- Left Sidebar (Rooms & Profile) -->
    <div class="w-20 md:w-72 bg-gray-900 text-white flex flex-col flex-shrink-0 transition-all duration-300">
      <!-- App Header -->
      <div class="p-4 md:p-6 flex items-center justify-center md:justify-start border-b border-gray-800 h-16 md:h-20">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-600/30">
          <i class="fas fa-bolt text-white text-xl"></i>
        </div>
        <h1 class="hidden md:block ml-3 text-2xl font-bold tracking-tight text-white">E44geF</h1>
      </div>

      <!-- Rooms List -->
      <div class="flex-1 overflow-y-auto p-3 space-y-2 no-scrollbar">
        <div class="hidden md:block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 mt-2 px-3">Channels</div>
        <ul id="room-list" class="space-y-1">
          <!-- Rooms will be injected here via JS -->
        </ul>
      </div>

      <!-- User Profile (Bottom) -->
      <div class="p-4 bg-gray-950 border-t border-gray-800 flex items-center justify-center md:justify-start">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center shadow-inner flex-shrink-0">
          <i class="fas fa-user text-white/80"></i>
        </div>
        <div class="hidden md:block ml-3 overflow-hidden">
          <p class="text-sm font-medium text-white truncate">You</p>
          <p class="text-xs text-gray-500 truncate" id="user-id-display">ID: ...</p>
        </div>
      </div>
    </div>

    <!-- Right Main Area (Chat & Header) -->
    <div class="flex-1 flex flex-col bg-white relative shadow-[-10px_0_20px_rgba(0,0,0,0.05)] z-10">
      
      <!-- Chat Header -->
      <div class="h-16 md:h-20 border-b border-gray-100 flex items-center justify-between px-6 bg-white/80 backdrop-blur-sm z-20 sticky top-0">
        <div class="flex items-center">
          <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 mr-4">
            <i class="fas fa-hashtag text-lg"></i>
          </div>
          <div>
            <h2 id="chat-title" class="text-lg md:text-xl font-bold text-gray-800 tracking-tight">Select a room</h2>
            <p class="text-xs text-gray-400 font-medium">Public channel</p>
          </div>
        </div>
        
        <!-- Call Action Buttons -->
        <div class="flex items-center space-x-3">
          <button id="audio-call-btn" class="w-11 h-11 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1" title="Start Audio Call">
            <i class="fas fa-phone"></i>
          </button>
          <button id="video-call-btn" class="w-11 h-11 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md shadow-blue-600/30 transition-all hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1" title="Start Video Call">
            <i class="fas fa-video"></i>
          </button>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 bg-gray-50/50">
        <!-- Messages will be injected here via JS -->
        <div class="flex h-full items-center justify-center opacity-50">
          <p class="text-sm font-medium">No messages yet. Start the conversation!</p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-4 md:p-6 bg-white border-t border-gray-100">
        <div class="flex items-end bg-gray-50 rounded-2xl border border-gray-200 p-2 shadow-sm focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all">
          <button class="p-3 text-gray-400 hover:text-blue-500 transition-colors focus:outline-none">
            <i class="fas fa-plus-circle text-xl"></i>
          </button>
          <textarea id="message-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 resize-none p-3 max-h-32 text-gray-700 placeholder-gray-400 outline-none" placeholder="Type a message..."></textarea>
          <button id="send-btn" class="p-3 mb-0.5 mr-0.5 text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors focus:outline-none shadow-sm flex items-center justify-center w-10 h-10 shrink-0">
            <i class="fas fa-paper-plane text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Call Interface Overlay (Hidden by default) -->
  <div id="call-modal" class="fixed inset-0 bg-gray-950 z-50 hidden flex-col transition-opacity duration-300 opacity-0">
    <!-- Remote Video Area (Main) -->
    <div class="flex-1 relative overflow-hidden flex justify-center items-center">
      <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
      
      <!-- Background placeholder when remote video is not yet active -->
      <div id="remote-video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-[-1]">
         <div class="w-32 h-32 bg-gray-800 rounded-full flex items-center justify-center mb-6 shadow-inner">
           <i class="fas fa-user text-5xl opacity-50"></i>
         </div>
         <p class="text-xl tracking-wider font-light animate-pulse">Waiting for remote video...</p>
      </div>
      
      <!-- Local Video (Picture-in-Picture) -->
      <div class="absolute bottom-6 right-6 md:bottom-10 md:right-10 w-28 h-40 md:w-48 md:h-72 bg-gray-900 rounded-2xl overflow-hidden border border-gray-700 shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-10 transition-transform duration-300 hover:scale-105">
        <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
      </div>
      
      <!-- Call Info Header overlay -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-8 bg-gradient-to-b from-black/70 to-transparent z-10 flex justify-between items-start">
        <div class="text-white text-shadow-md">
          <div class="flex items-center gap-3 mb-1">
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
            <h2 class="text-xl md:text-2xl font-bold tracking-tight">Active Call</h2>
          </div>
          <p class="opacity-70 text-sm md:text-base font-medium flex items-center gap-2">
            <i class="fas fa-hashtag text-xs"></i> <span id="call-room-display">Room Name</span>
          </p>
        </div>
        <div class="bg-black/40 backdrop-blur-md px-4 py-2 rounded-full text-white text-sm font-mono tracking-widest shadow-inner">
          <span id="call-timer">00:00</span>
        </div>
      </div>
    </div>
    
    <!-- Call Controls Bottom Bar -->
    <div class="bg-gray-900/90 backdrop-blur-lg border-t border-gray-800 p-6 md:p-8 flex justify-center space-x-6 md:space-x-10 items-center shadow-[0_-10px_40px_rgba(0,0,0,0.3)] z-20">
      <button id="toggle-audio-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center shadow-lg transition-colors focus:outline-none ring-2 ring-transparent focus:ring-gray-500">
        <i class="fas fa-microphone text-xl"></i>
      </button>
      <button id="end-call-btn" class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg shadow-red-500/20 hover:scale-110 transition-all focus:outline-none ring-4 ring-transparent focus:ring-red-400">
        <i class="fas fa-phone-slash text-2xl md:text-3xl"></i>
      </button>
      <button id="toggle-video-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gray-700 hover:bg-gray-600 text-white flex items-center justify-center shadow-lg transition-colors focus:outline-none ring-2 ring-transparent focus:ring-gray-500">
        <i class="fas fa-video text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="incoming-call-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex-col items-center justify-center transition-opacity duration-300 opacity-0">
    <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 relative overflow-hidden transform scale-95 transition-transform duration-300" id="incoming-call-card">
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-100 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob"></div>
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-100 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-2000"></div>
      
      <div class="relative z-10">
        <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30 relative">
          <div class="absolute inset-0 rounded-full border-4 border-blue-400 animate-ping opacity-20"></div>
          <i class="fas fa-phone-volume text-4xl text-white animate-pulse"></i>
        </div>
        <h3 class="text-2xl font-bold mb-2 text-gray-800 tracking-tight">Incoming Call</h3>
        <p class="text-gray-500 mb-8 font-medium bg-gray-100 inline-block px-4 py-1.5 rounded-full" id="incoming-room-name">From: Room Name</p>
        
        <div class="flex justify-center space-x-8">
          <button id="reject-call-btn" class="w-16 h-16 bg-red-500 rounded-full flex flex-col items-center justify-center text-white hover:bg-red-600 shadow-lg shadow-red-500/30 transition-transform transform hover:-translate-y-1 focus:outline-none">
            <i class="fas fa-phone-slash text-xl mb-0.5"></i>
          </button>
          <button id="answer-call-btn" class="w-16 h-16 bg-green-500 rounded-full flex flex-col items-center justify-center text-white hover:bg-green-600 shadow-lg shadow-green-500/30 transition-transform transform hover:-translate-y-1 focus:outline-none animate-bounce">
            <i class="fas fa-phone text-xl mb-0.5"></i>
          </button>
        </div>
        <div class="flex justify-center space-x-12 mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">
           <span>Decline</span>
           <span class="ml-2">Accept</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Firebase Environment Setup
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'e44gef-default-id';
    const firebaseConfig = {
  apiKey: "AIzaSyBemcR88rDyuwsDbR-mMqWJRe3NsrANgj8",
  authDomain: "e44gef.firebaseapp.com",
  projectId: "e44gef",
  storageBucket: "e44gef.firebasestorage.app",
  messagingSenderId: "32963682142",
  appId: "1:32963682142:web:f409ebd7f21e67cbec39cf",
  measurementId: "G-KY5R5MXW4Z"
};    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // DOM Elements Reference
    const dom = {
      loadingOverlay: document.getElementById('loading-overlay'),
      roomList: document.getElementById('room-list'),
      chatTitle: document.getElementById('chat-title'),
      chatMessages: document.getElementById('chat-messages'),
      messageInput: document.getElementById('message-input'),
      sendBtn: document.getElementById('send-btn'),
      videoCallBtn: document.getElementById('video-call-btn'),
      audioCallBtn: document.getElementById('audio-call-btn'),
      
      callModal: document.getElementById('call-modal'),
      localVideo: document.getElementById('local-video'),
      remoteVideo: document.getElementById('remote-video'),
      endCallBtn: document.getElementById('end-call-btn'),
      toggleAudioBtn: document.getElementById('toggle-audio-btn'),
      toggleVideoBtn: document.getElementById('toggle-video-btn'),
      callRoomDisplay: document.getElementById('call-room-display'),
      callTimer: document.getElementById('call-timer'),
      
      incomingCallModal: document.getElementById('incoming-call-modal'),
      incomingCallCard: document.getElementById('incoming-call-card'),
      answerCallBtn: document.getElementById('answer-call-btn'),
      rejectCallBtn: document.getElementById('reject-call-btn'),
      incomingRoomName: document.getElementById('incoming-room-name'),
      userIdDisplay: document.getElementById('user-id-display')
    };

    // Global Application State
    let currentUser = null;
    let currentRoomId = 'general';
    const rooms = [
      { id: 'general', name: 'General Lounge', icon: 'fa-globe' },
      { id: 'tech', name: 'Tech Talk', icon: 'fa-laptop-code' },
      { id: 'random', name: 'Random Break', icon: 'fa-coffee' },
      { id: 'help', name: 'Support', icon: 'fa-life-ring' }
    ];
    let allMessages = [];
    let allCandidates = [];

    // WebRTC State
    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let isCaller = false;
    let callDocUnsubscribe = null;
    let candidatesUnsubscribe = null;
    let audioEnabled = true;
    let videoEnabled = true;
    let callInterval = null;
    let callStartTime = null;

    // STUN Servers for WebRTC P2P connection
    const rtcConfig = {
      iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
      ]
    };

    
    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        dom.userIdDisplay.innerText = `ID: ${user.uid.substring(0, 8)}`;
        
        // Hide loading
        dom.loadingOverlay.style.opacity = '0';
        setTimeout(() => dom.loadingOverlay.classList.add('hidden'), 500);
        
        // Initialize App features
        renderRoomList();
        selectRoom('general');
        setupRealtimeListeners();
      }
    });

    // Run Initial Authentication
    async function initAuth() {
      try {
        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth initialization failed:", error);
        // Show error on UI if needed, but keeping it robust for now
      }
    }
    
    // Start App
    initAuth();



    function renderRoomList() {
      dom.roomList.innerHTML = '';
      rooms.forEach(room => {
        const li = document.createElement('li');
        const isActive = room.id === currentRoomId;
        
        li.className = `
          p-3 rounded-xl cursor-pointer flex items-center transition-all duration-200 mx-2
          ${isActive 
            ? 'bg-blue-600 text-white shadow-md' 
            : 'text-gray-400 hover:bg-gray-800 hover:text-white'}
        `;
        
        li.innerHTML = `
          <div class="w-8 h-8 rounded-lg flex items-center justify-center mr-3 ${isActive ? 'bg-white/20' : 'bg-gray-800'}">
            <i class="fas ${room.icon} text-sm"></i>
          </div>
          <span class="font-medium text-sm md:text-base ${isActive ? '' : 'hidden md:inline'} truncate">${room.name}</span>
        `;
        
        li.onclick = () => selectRoom(room.id);
        dom.roomList.appendChild(li);
      });
    }

    function selectRoom(roomId) {
      currentRoomId = roomId;
      const roomInfo = rooms.find(r => r.id === roomId);
      
      renderRoomList();
      dom.chatTitle.innerText = roomInfo.name;
      dom.callRoomDisplay.innerText = roomInfo.name;
      
      renderMessages();
      
      // Update WebRTC listening for the new room
      listenToCallForRoom(roomId);
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderMessages() {
      dom.chatMessages.innerHTML = '';
      
      // Filter by current room and sort chronologically
      const roomMessages = allMessages
        .filter(m => m.roomId === currentRoomId)
        .sort((a, b) => a.timestamp - b.timestamp);
      
      if (roomMessages.length === 0) {
        dom.chatMessages.innerHTML = `
          <div class="flex h-full flex-col items-center justify-center opacity-40">
            <i class="fas fa-comments text-5xl mb-4"></i>
            <p class="text-sm font-medium">It's quiet here. Send a message to start!</p>
          </div>
        `;
        return;
      }

      let lastUserId = null;

      roomMessages.forEach((msg, index) => {
        const isMine = msg.userId === currentUser?.uid;
        const showAvatar = lastUserId !== msg.userId || index === 0;
        
        const div = document.createElement('div');
        div.className = `flex w-full ${isMine ? 'justify-end' : 'justify-start'} ${showAvatar ? 'mt-4' : 'mt-1'}`;
        
        let html = '';
        
        // Avatar for others
        if (!isMine && showAvatar) {
          html += `
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-400 to-gray-500 flex items-center justify-center text-white flex-shrink-0 mr-2 mt-1">
              <i class="fas fa-user text-xs"></i>
            </div>
          `;
        } else if (!isMine) {
          html += `<div class="w-8 mr-2 flex-shrink-0"></div>`; // spacer
        }

        // Message Bubble Container
        html += `<div class="max-w-[75%] md:max-w-[60%] flex flex-col ${isMine ? 'items-end' : 'items-start'}">`;
        
        // Sender Name
        if (!isMine && showAvatar) {
          html += `<span class="text-xs text-gray-500 ml-1 mb-1 font-medium">${msg.userName}</span>`;
        }

        // Bubble
        const bubbleStyle = isMine 
          ? `bg-blue-600 text-white rounded-2xl rounded-tr-sm shadow-sm` 
          : `bg-white text-gray-800 rounded-2xl rounded-tl-sm border border-gray-100 shadow-sm`;
        
        html += `
          <div class="px-4 py-2.5 ${bubbleStyle} break-words text-sm relative group">
            ${msg.text.replace(/\n/g, '<br>')}
            
            <div class="${isMine ? 'right-full mr-2' : 'left-full ml-2'} top-1/2 -translate-y-1/2 absolute opacity-0 group-hover:opacity-100 transition-opacity text-[10px] text-gray-400 whitespace-nowrap">
              ${formatTime(msg.timestamp)}
            </div>
          </div>
        `;

        html += `</div>`; // End Bubble Container
        
        div.innerHTML = html;
        dom.chatMessages.appendChild(div);
        
        lastUserId = msg.userId;
      });
      
      // Auto-scroll to bottom
      dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = dom.messageInput.value.trim();
      if (!text || !currentUser) return;
      
      dom.messageInput.value = '';
      dom.messageInput.style.height = 'auto'; // Reset height
      
      const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
      try {
        await addDoc(messagesRef, {
          roomId: currentRoomId,
          text: text,
          userId: currentUser.uid,
          userName: `User ${currentUser.uid.substring(0,4)}`,
          timestamp: Date.now()
        });
      } catch(e) { 
        console.error("Error sending message", e); 
      }
    }

    // Input events
    dom.sendBtn.onclick = sendMessage;
    dom.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    // Auto-resize textarea
    dom.messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });



    function setupRealtimeListeners() {
      // 1. Listen to all messages globally (Rule 2: No complex queries, fetch all, filter JS)
      const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
      onSnapshot(messagesRef, (snapshot) => {
        allMessages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderMessages();
      }, (error) => console.error("Messages sync error:", error));

      // 2. Listen to all ICE Candidates globally
      const candidatesRef = collection(db, 'artifacts', appId, 'public', 'data', 'candidates');
      candidatesUnsubscribe = onSnapshot(candidatesRef, (snapshot) => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            const data = change.doc.data();
            const candidateObj = { id: change.doc.id, ...data };
            allCandidates.push(candidateObj);
            
            // Process candidate if it's for current active room call
            if (pc && data.roomId === currentRoomId) {
              // Caller needs Callee's candidates, and vice versa
              if ((isCaller && data.type === 'callee') || (!isCaller && data.type === 'caller')) {
                const candidate = new RTCIceCandidate(data.candidate);
                pc.addIceCandidate(candidate).catch(e => console.error('Error adding ICE', e));
              }
            }
          }
          if (change.type === 'removed') {
             allCandidates = allCandidates.filter(c => c.id !== change.doc.id);
          }
        });
      }, (error) => console.error("Candidates sync error:", error));
    }



    function listenToCallForRoom(roomId) {
      if (callDocUnsubscribe) callDocUnsubscribe(); // Unsubscribe previous room
      
      const callDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'calls', roomId);
      callDocUnsubscribe = onSnapshot(callDocRef, async (snapshot) => {
        if (!snapshot.exists()) {
          // Call document deleted = Call Ended or No active call
          if (pc) {
            handleRemoteHangup();
          } else {
            hideIncomingCallModal();
          }
          return;
        }
        
        const data = snapshot.data();
        
        // Incoming Call detected (Offer exists, we didn't make it, not in a call yet)
        if (data.offer && !isCaller && !pc) {
           const roomName = rooms.find(r => r.id === roomId)?.name || 'Unknown Room';
           showIncomingCallModal(roomName);
        }
        
        // Callee Answered (We are caller, Answer arrived, PC exists, waiting for answer)
        if (data.answer && isCaller && pc && pc.remoteDescription === null) {
          try {
            const rtcSessionDescription = new RTCSessionDescription(data.answer);
            await pc.setRemoteDescription(rtcSessionDescription);
          } catch (e) {
            console.error("Error setting remote description from answer", e);
          }
        }
      }, (error) => console.error("Call sync error:", error));
    }

    async function startCall(withVideo) {
      if (!currentUser) return;
      isCaller = true;
      videoEnabled = withVideo;
      audioEnabled = true;
      
      showCallModal();
      startCallTimer();
      updateMediaButtonsUI();
      
      try {
        // Request Media
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: withVideo ? { facingMode: "user" } : false, 
          audio: true 
        });
        dom.localVideo.srcObject = localStream;
        
        setupPeerConnection();
        
        // Add tracks to PC
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
        
        // Create Offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        // Save Offer to Firestore (Signals the other clients in the room)
        const callDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'calls', currentRoomId);
        await setDoc(callDocRef, {
          offer: { type: offer.type, sdp: offer.sdp },
          callerId: currentUser.uid,
          timestamp: Date.now()
        });
        
      } catch (err) {
        console.error("Error starting call:", err);
        // Fallback alert using modal/UI (Avoid native alert per rules)
        endCallLocalOnly();
        const btn = document.getElementById('audio-call-btn');
        btn.classList.add('bg-red-100', 'text-red-600');
        setTimeout(() => btn.classList.remove('bg-red-100', 'text-red-600'), 2000);
      }
    }

    async function answerCall() {
      if (!currentUser) return;
      hideIncomingCallModal();
      isCaller = false;
      videoEnabled = true; // Default answer with both, user can turn off
      audioEnabled = true;
      
      showCallModal();
      startCallTimer();
      updateMediaButtonsUI();
      
      try {
        // Request Media
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        dom.localVideo.srcObject = localStream;
        
        setupPeerConnection();
        
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
        
        // Fetch Call Doc for Offer
        const callDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'calls', currentRoomId);
        const callSnap = await getDoc(callDocRef);
        
        if (!callSnap.exists()) {
           throw new Error('Call dropped before answering');
        }
        const callData = callSnap.data();
        
        // Apply Offer
        const offerDescription = new RTCSessionDescription(callData.offer);
        await pc.setRemoteDescription(offerDescription);
        
        // Create & Apply Answer
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        
        // Send Answer to Firestore (merge: true updates the doc)
        await setDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp } }, { merge: true });
        
      } catch (err) {
        console.error("Error answering call:", err);
        endCallLocalOnly();
      }
    }



    function setupPeerConnection() {
      pc = new RTCPeerConnection(rtcConfig);
      
      remoteStream = new MediaStream();
      dom.remoteVideo.srcObject = remoteStream;
      
      // When remote tracks arrive
      pc.ontrack = event => {
        event.streams[0].getTracks().forEach(track => {
          remoteStream.addTrack(track);
        });
      };
      
      // When ICE candidate generated locally
      pc.onicecandidate = event => {
        if (event.candidate) {
          const candidatesRef = collection(db, 'artifacts', appId, 'public', 'data', 'candidates');
          addDoc(candidatesRef, {
            roomId: currentRoomId,
            type: isCaller ? 'caller' : 'callee',
            candidate: event.candidate.toJSON(),
            timestamp: Date.now()
          }).catch(e => console.error("Error saving ICE", e));
        }
      };

      // Connection state changes
      pc.onconnectionstatechange = () => {
         if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
            endCallLocalOnly();
         }
      };
    }

    async function endCall() {
      // 1. Clean up local WebRTC objects
      endCallLocalOnly();
      
      // 2. Clean up Firestore Signaling Data (This tells others the call ended)
      if (currentUser) {
        try {
          // Delete call state
          const callDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'calls', currentRoomId);
          await deleteDoc(callDocRef);
          
          // Delete associated candidates
          const candidatesToDelete = allCandidates.filter(c => c.roomId === currentRoomId);
          for (const c of candidatesToDelete) {
             await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'candidates', c.id));
          }
        } catch(e) { 
          console.error("Cleanup error", e); 
        }
      }
    }

    function handleRemoteHangup() {
      if (pc) {
         endCallLocalOnly();
      } else {
         hideIncomingCallModal(); 
      }
    }

    function endCallLocalOnly() {
      stopCallTimer();
      
      if (pc) { 
        pc.close(); 
        pc = null; 
      }
      if (localStream) { 
        localStream.getTracks().forEach(track => track.stop()); 
        localStream = null; 
      }
      
      dom.localVideo.srcObject = null;
      dom.remoteVideo.srcObject = null;
      
      hideCallModal();
      hideIncomingCallModal();
      isCaller = false;
    }

    async function rejectCall() {
      hideIncomingCallModal();
      // Deleting the doc signals rejection to caller
      if (currentUser) {
         try {
           const callDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'calls', currentRoomId);
           await deleteDoc(callDocRef);
         } catch(e) { console.error(e); }
      }
    }


    // Modals Control
    function showCallModal() {
      dom.callModal.classList.remove('hidden');
      dom.callModal.classList.add('flex');
      // small delay for transition
      setTimeout(() => dom.callModal.classList.remove('opacity-0'), 50);
    }

    function hideCallModal() {
      dom.callModal.classList.add('opacity-0');
      setTimeout(() => {
        dom.callModal.classList.add('hidden');
        dom.callModal.classList.remove('flex');
      }, 300);
    }

    function showIncomingCallModal(roomName) {
      if (dom.incomingCallModal.classList.contains('flex')) return; // Already showing
      dom.incomingRoomName.innerText = `From: ${roomName}`;
      dom.incomingCallModal.classList.remove('hidden');
      dom.incomingCallModal.classList.add('flex');
      
      setTimeout(() => {
        dom.incomingCallModal.classList.remove('opacity-0');
        dom.incomingCallCard.classList.remove('scale-95');
        dom.incomingCallCard.classList.add('scale-100');
      }, 10);
    }

    function hideIncomingCallModal() {
      dom.incomingCallModal.classList.add('opacity-0');
      dom.incomingCallCard.classList.remove('scale-100');
      dom.incomingCallCard.classList.add('scale-95');
      setTimeout(() => {
        dom.incomingCallModal.classList.add('hidden');
        dom.incomingCallModal.classList.remove('flex');
      }, 300);
    }

    // Media Controls
    function toggleAudio() {
      if (localStream) {
        audioEnabled = !audioEnabled;
        const audioTracks = localStream.getAudioTracks();
        if(audioTracks.length > 0) {
           audioTracks[0].enabled = audioEnabled;
        }
        updateMediaButtonsUI();
      }
    }

    function toggleVideo() {
      if (localStream) {
        videoEnabled = !videoEnabled;
        const videoTracks = localStream.getVideoTracks();
        if(videoTracks.length > 0) {
            videoTracks[0].enabled = videoEnabled;
        }
        updateMediaButtonsUI();
      }
    }

    function updateMediaButtonsUI() {
      dom.toggleAudioBtn.innerHTML = `<i class="fas fa-microphone${audioEnabled ? '' : '-slash'} text-xl"></i>`;
      dom.toggleAudioBtn.className = `w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center shadow-lg transition-colors focus:outline-none ring-2 ring-transparent ${audioEnabled ? 'bg-gray-700 hover:bg-gray-600 text-white focus:ring-gray-500' : 'bg-red-500 text-white focus:ring-red-400'}`;
      
      dom.toggleVideoBtn.innerHTML = `<i class="fas fa-video${videoEnabled ? '' : '-slash'} text-xl"></i>`;
      dom.toggleVideoBtn.className = `w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center shadow-lg transition-colors focus:outline-none ring-2 ring-transparent ${videoEnabled ? 'bg-gray-700 hover:bg-gray-600 text-white focus:ring-gray-500' : 'bg-red-500 text-white focus:ring-red-400'}`;
    }

    // Call Timer
    function startCallTimer() {
      callStartTime = Date.now();
      dom.callTimer.innerText = "00:00";
      callInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - callStartTime) / 1000);
        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
        const secs = String(diff % 60).padStart(2, '0');
        dom.callTimer.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (callInterval) {
        clearInterval(callInterval);
        callInterval = null;
      }
    }

    // Event Bindings
    dom.videoCallBtn.onclick = () => startCall(true);
    dom.audioCallBtn.onclick = () => startCall(false);
    dom.endCallBtn.onclick = endCall;
    dom.toggleAudioBtn.onclick = toggleAudio;
    dom.toggleVideoBtn.onclick = toggleVideo;
    dom.answerCallBtn.onclick = answerCall;
    dom.rejectCallBtn.onclick = rejectCall;

  </script>
</body>
</html>
